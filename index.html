
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Dụng Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>My sex toy store </h1>
        <input type="text" id="searchInput" placeholder="Tìm sản phẩm...">
        <button id="cartButton">🛒 Giỏ hàng: <span id="cartCount">0</span></button>
    </header>

    <section class="banner">
        <h2>Chăm sóc ngôi nhà của bạn</h2>
        <p>Khám phá những sản phẩm gia dụng tiện ích mỗi ngày.</p>
        <a href="#products">Mua sắm ngay</a>
    </section>

    <main class="container">
        <h2>Sản phẩm nổi bật</h2>
        <div id="productList" class="product-list"></div>
    </main>

    <script src="main.js"></script>
</body>
</html>
